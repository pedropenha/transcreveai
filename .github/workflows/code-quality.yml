name: "code quality"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/src/catalog/catalog.json"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".eslintrc*"
      - "eslint.config.*"
      - ".prettierrc*"
      - "tsconfig*"
      - "tailwind.config.*"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      # test:unit supersedes the old test:keyboard step — it runs all
      # standalone unit tests including keyboard.test.ts.
      - name: Run unit tests
        run: bun run test:unit

      # T-002 / ADR-0001 ratchet 2: the four baseline modules loaded by
      # scripts/unit-coverage.test.ts must stay at >= 96.61% lines and
      # >= 92.86% functions (mean of per-file percentages).
      - name: Check frontend coverage ratchet
        run: bun scripts/check-frontend-coverage.ts

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier
        run: bun run format:check
