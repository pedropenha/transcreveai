name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Semver pre-release suffix (x.y.z-*) → GitHub prerelease flag.
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            // Idempotent: a re-run after a failed matrix leg must reuse the
            // existing draft for this tag rather than die on already_exists.
            // getReleaseByTag never matches drafts, so scan the list.
            const tag = `v${{ steps.get-version.outputs.version }}`;
            const existing = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            const draft = existing.find((r) => r.tag_name === tag && r.draft);
            if (draft) return draft.id;
            const published = existing.find(
              (r) => r.tag_name === tag && !r.draft,
            );
            if (published) {
              throw new Error(
                `A published release already exists for ${tag} — refusing to attach new artifacts to it`,
              );
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: true,
              prerelease: ${{ steps.get-version.outputs.prerelease }},
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships ad-hoc signed (signingIdentity "-") until there is a
          # reason to pay for a Developer ID. Unsigned updates re-break the
          # app's Accessibility and Microphone grants on every update (TCC
          # keys them to the signing identity) — that cost exists for the
          # manual .dmg install too, and macOS is the platform our users
          # actually asked for, so the legs stay in. Re-sign when a
          # certificate lands (sign-binaries: true + Apple secrets).
          - platform: "macos-26" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          # NSIS only — `targets: "all"` would also try MSI, which rejects
          # semver pre-release versions (0.10.0-beta.* → "must be numeric").
          - platform: "windows-latest"
            args: "--bundles nsis"
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc --bundles nsis"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # OS-level code signing only (Azure Trusted Signing / Apple Developer
      # ID): no certificate, so `true` would hand the signing step empty
      # credentials and fail the job. The *updater* signature is unaffected —
      # build.yml passes its key independently of this input.
      sign-binaries: false
      asset-prefix: "transcreve-ai"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit
