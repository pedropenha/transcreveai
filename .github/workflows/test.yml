name: "test"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/check-*.ts"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - "scripts/check-*.ts"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libvulkan-dev + glslc + spirv-headers let transcribe-cpp-sys build
          # ggml's Vulkan backend (the Linux `vulkan` feature). Mirrors the apt
          # set transcribe.cpp's native-ci uses to build -DTRANSCRIBE_VULKAN=ON.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # Same env prep as scripts/windows-dev-env.ps1 needs on a dev box:
      # VULKAN_SDK (from the action above) + SPIRV-Headers on CMAKE_PREFIX_PATH
      # for ggml-vulkan's find_package. The script's -BypassJunction /
      # CARGO_TARGET_DIR pieces are deliberately NOT used: they exist only for
      # the local machine whose MSBuild cannot follow the %LOCALAPPDATA%\tcs
      # junction (MSB1009, see BUILD.md) — CI runners have no such issue, and
      # transcribe-cpp-sys >= 0.1.3 self-mitigates MAX_PATH via that junction.
      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.os }}-rust-tests

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  # ADR-0001 ratchet 3: `clippy --workspace --all-targets -- -D warnings` must
  # stay at zero warnings on every platform — the baseline was measured on
  # Windows and never compiled the macOS/Linux-only paths, so each OS runs the
  # gate to cover its cfg(target_os) branches. macos-26 matches build.yml:
  # it carries the SDK with FoundationModels (Apple Intelligence).
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev \
            libvulkan-dev glslc spirv-headers

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.os }}-clippy

      - name: Clippy (zero warnings)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ADR-0001 ratchet 1: coverage floors are per-target and the baseline was
  # measured on Windows x86_64, so the gate runs on windows-latest with the
  # same command (`cargo llvm-cov --workspace --all-targets`).
  coverage:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vulkan SDK (Windows)
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows)
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-latest-coverage

      - name: Measure coverage (instrumented tests)
        working-directory: src-tauri
        run: cargo llvm-cov --workspace --all-targets --json --summary-only --output-path llvm-cov.json

      - name: Check coverage ratchet against the T-001a baseline
        run: bun scripts/check-rust-coverage.ts src-tauri/llvm-cov.json

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: llvm-cov-report
          path: src-tauri/llvm-cov.json
          retention-days: 7

  # ADR-0001 ratchets 4+5: dependency policy (deny.toml) and the audit
  # exception list (.cargo/audit.toml) — a new advisory or a source/license
  # outside the allowlist fails the gate.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: cargo deny check (sources, licenses, bans, advisories)
        working-directory: src-tauri
        run: cargo deny check

      - name: cargo audit (vulnerability feed)
        working-directory: src-tauri
        run: cargo audit

  # ADR-0001 ratchet 6: files >800 lines, production unwrap()/expect() and
  # production unsafe must not grow past the recorded ceilings. The counters
  # live in scripts/ so the same check runs locally and in CI.
  debt-ratchet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check inherited-debt ratchets
        run: bun scripts/check-inherited-debt.ts
