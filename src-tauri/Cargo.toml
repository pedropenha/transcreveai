[package]
name = "transcreve-ai"
version = "0.10.0-beta.3"
description = "Transcreve.ai"
authors = ["Creator4all", "CJ Pais"]
edition = "2021"
license = "MIT"
default-run = "transcreve-ai"

[profile.dev]
incremental = true # Compile your binary in smaller steps.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transcreve_ai_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# E2E test builds only (T-009, F002 technical notes): when this feature is
# compiled in AND the `TRANSCREVE_AUDIO_FIXTURE` env var points to a WAV file,
# the capture pipeline reads that file instead of a microphone. Release builds
# never enable it, so production binaries cannot be pointed at a file.
audio-fixture = []

# [[bin]]
# name = "cli"
# path = "src/audio_toolkit/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dependencies]
tempfile = "3"
once_cell = "1"
tauri = { version = "2.11.5", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  'image-png',
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
rusqlite_migration = "2.3"
tauri-plugin-fs = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = { git = "https://github.com/rustdesk-org/rdev", rev = "a90dbe1172f8832f54c97c62e823c5a34af5fdfe" }
cpal = "0.16.0"
rtrb = "0.4.0"
anyhow = "1.0.95"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
env_filter = "0.1.0"
# `process` for the headless `cli_agent` LLM providers (F012); `time`/
# `io-util` are already pulled in transitively but declared for clarity.
tokio = { version = "1.43.0", features = ["process", "io-util", "time", "net", "sync", "rt", "macros", "io-std"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498", default-features = false }
earshot = "1.2.2"
enigo = "0.6.1"
rodio = { git = "https://github.com/cjpais/rodio.git", rev = "fed30292db417cb95305c118c0e1d804fb74cbff" }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
# F013 uses official MCP/OAuth libraries; transports stay backend-only.
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest"] }
reqwest13 = { package = "reqwest", version = "=0.13.2", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
rustfft = "6.4.0"
strsim = "0.11.0"
natural = "0.5.0"
regex = "1"
# OS credential vault for provider API keys (FR-011-01). Pinned: keyring 4.1.6
# (2026-07-14) + keyring-core 1.0.0 — the last releases comfortably older than
# 7 days — so the Windows credential target stays `Transcreve.ai/provider/<id>`.
# `v1` (default) enables Windows Credential Manager, macOS Keychain and the
# freedesktop Secret Service store.
keyring = "=4.1.6"
keyring-core = "=1.0.0"
# Text-based language ID (filler-word removal fallback); isolang bridges the
# ISO 639-1 codes in model metadata to whatlang's 639-3 codes.
whatlang = "0.16"
isolang = "2"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# Meeting-app icon -> PNG data URI (meeting::app_icon).
png = "0.18"
base64 = "0.22"
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# Whisper-family models run through transcribe-cpp (GGUF/ggml, native backends);
# transcribe-rs is now ONNX-only (Parakeet, Moonshine, SenseVoice, GigaAM,
# Canary, Cohere). Per-platform backend features are added in the target tables.
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = { version = "0.2.4", default-features = false }
handy-keys = "0.3.4"
ferrous-opencc = "0.2.3"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
thiserror = "2"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2.6"
hf-hub = { git = "https://github.com/cjpais/hf-hub", rev = "9918f11ab3473135eb7865aa4a5d79d597e6e810", features = [
  "tokio",
] }
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
tauri-plugin-updater = "2.10.1"

[target.'cfg(windows)'.dependencies]
# Used to reach ICoreWebView2Settings3 through the webview's controller
# (disabling browser accelerator keys in the main window). Must match the
# version wry links against so the COM types are identical.
webview2-com = "0.38"
# ONNX Runtime on Windows x64 links Microsoft's official build (see the
# comment in the x86_64 target table below and build.yml's ORT step) — that
# binary already ships DmlExecutionProvider, so `ort-directml` only turns the
# EP *registration* on and costs ~0 bytes. Auto maps to DirectML there so ONNX
# models (Parakeet, Moonshine, …) run GPU-bound; users can still force CPU.
# Windows ARM64 keeps static CPU-only ORT (all its targets are modern anyway).
windows = { version = "0.61.3", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_Controls",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

# Whisper backend per Windows arch. x86_64 ships the Vulkan GPU backend and
# keeps the dynamic-backends posture (loadable per-ISA CPU modules + Vulkan),
# where runtime ISA scoring (GGML_CPU_ALL_VARIANTS) earns the extra shipped DLLs.
#
# Windows-on-ARM is CPU-only: its Adreno Vulkan drivers are immature, and
# ggml-vulkan's shader generator (vulkan-shaders-gen) does not build under the
# clang-cl/lld toolchain that ggml's ARM CPU backend requires. dynamic-backends
# buys nothing on ARM — ALL_VARIANTS is an x86 concept, so a DL build there is
# just a single portable CPU module shipped as a DLL. So ARM links transcribe-cpp
# STATICALLY (no features = static CPU-only): the one CPU backend is compiled into
# transcreve-ai.exe and we ship zero DLLs, which sidesteps the installer's per-DLL
# signtool verify entirely. CI pins -DGGML_NATIVE=OFF (see build.yml) so the
# static build targets a portable ARM baseline, not the build runner's CPU.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.2.4", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }
# DirectML EP registration. The old pyke-prebuilt AVX2 crash that motivated
# CPU-only ORT does not apply: build.yml now links Microsoft's official
# onnxruntime.dll, which uses SSE2 baseline + runtime CPU dispatch and already
# contains DmlExecutionProvider.
transcribe-rs = { version = "0.3.8", features = ["onnx", "ort-directml"] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.2.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2" # sysctlbyname for RAM probing + statvfs for free disk space (FR-003-05/06)
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "da9c9a8d4eb7f0524a2508988df1a7d9585b4904" }
transcribe-cpp = { version = "0.2.4", default-features = false, features = ["metal"] }
# CoreML EP (Neural Engine/GPU): both ORT dylibs we ship (x86_64 from
# blob.handy.computer, aarch64 via pyke's download) contain
# CoreMLExecutionProvider, and Auto() registers it ahead of CPU.
transcribe-rs = { version = "0.3.8", features = ["onnx", "ort-coreml"] }
# Used by the receipt-sequenced ("reliable") paste path for lazy NSPasteboard
# promises. Versions track what Tauri already pulls in.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3.2"
# ScreenCaptureKit system-audio capture (audio_toolkit::loopback) — Apple-only.
objc2-screen-capture-kit = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-audio-types = "0.3.2"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
gtk = "0.18"
libc = "0.2"
transcribe-cpp = { version = "0.2.4", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

# TEMPORARY: tao pinned past 0.35.3 for the Wayland client-side-decorations fix
# (tao #1218, fixes tauri #11856 — dead titlebar buttons after visible(false) →
# show()). Drop this once a tao release containing it lands in tauri.
#
# The rev is a cjpais/tao branch, not upstream: dev past 0.35.3 also carries
# tao #1231 (removed window subclassing), which left the thread event target's
# WNDPROC falling through to DefSubclassProc. On a no-longer-subclassed window
# that returns 0, so WM_QUERYENDSESSION answered FALSE and vetoed Windows
# shutdown (Handy #1710). `handy` = 07f3742b + a cherry-pick of tao #1274
# (DefSubclassProc → DefWindowProcW). Repoint at upstream once #1274 merges.
#
# tao-macros must be patched to the SAME rev even though nothing here depends on
# it directly: wry pulls tao-macros 0.1.3 from crates.io, so without this the
# lockfile carries two tao-macros 0.1.3 entries (registry + git). cargo tolerates
# that, but Nix's importCargoLock vendors both to the same `tao-macros-0.1.3`
# dir and fails with a symlink collision. Unifying the source removes the dup.
[patch.crates-io]
tao = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }
tao-macros = { git = "https://github.com/cjpais/tao", rev = "c3bee28c1d446d95f08c95c3b6f8d4bde052b876" }

[dev-dependencies]
# Test-only tokio features for the local socket servers exercising the
# resumable HTTP downloader; normal builds keep the leaner feature set.
tokio = { version = "1.43.0", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
